# tuned/compliance.conf -- read by tuned-common's tools/tuned_compliance.sh (docs/ARCHITECTURE.md section 6).
# na: = the requirement does not apply to this repo (reason, date). exception: = a recorded deviation (reason, date).
# attest: lines name the commit a person read; an attestation goes stale when tuned/ code changes.
kinds: native
na: D1 | nccl consumes no other tuned repo's package; it is the bottom of the chain (pytorch and llama.cpp consume it) | 2026-10-18
na: D2 | nccl ships no CMake package, only a static archive and headers | 2026-10-18
na: D3 | the producer->consumer pairing table is kept by the consumers (llama.cpp, pytorch nccl.pins); nccl has no upstream tuned dependency | 2026-10-18
na: F1 | the package ships no shared object: only libnccl_static.a (a shared library of ours would need its own SONAME next to NVIDIA's libnccl.so.2) | 2026-10-18
na: F2 | the package ships no shared object, so there is no DT_NEEDED or SONAME to gate | 2026-10-18
na: F3 | the package ships no executable | 2026-10-18
exception: C2 | the per-toolkit tree is build/<cuda>/ at the repo root (upstream NCCL already gitignores /build*), not tuned/build/<cuda>/, and it does not use gpu_tuned_out_dir; it has no variant or per-commit level, and keeps a fixed work/nccl for make so ccache keys do not change per commit (tuned/env.sh). Same shape as C2 otherwise | 2026-10-18
